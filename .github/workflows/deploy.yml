name: sync-firestore

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: true

jobs:
  # 페이지 배포는 Vercel GitHub 연동이 담당 (main = 프로덕션, PR = 미리보기)
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Sync Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: npm run sync
